# Builds the optional ONNX layer (libLCContentML).  It is OFF by default, so key4hep-build.yaml
# never compiles it; this job turns it on.  onnxruntime comes from the Key4hep stack.
name: Key4hep build (ML)
on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '16 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K4_CMAKE_EXTRA_ARGS: -DLCContent_BUILD_ML=ON

jobs:
  build:
    strategy:
      matrix:
        build_type: ["release", "nightly"]
        image: ["alma9"]
      fail-fast: false
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/key4hep/key4hep-images/${{ matrix.image }}-cvmfs
      options: --privileged
      volumes:
        - /home/runner/.cache/ccache:/root/.cache/ccache
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
    - name: Mount CVMFS
      run: /mount.sh
    - uses: key4hep/key4hep-actions/cache-external-data@main
    - uses: key4hep/key4hep-actions/key4hep-build@main
      with:
        build_type: ${{ matrix.build_type }}
        image: ${{ matrix.image }}
